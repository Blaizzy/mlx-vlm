name: PR contributor reminder

on:
  pull_request_target:
    types: [opened]

permissions:
  contents: read
  pull-requests: write

# GitHub usernames that should not receive the reminder, one per line.
env:
  PR_REMINDER_EXCLUDED_USERS: |
    Lazarus-931
    Blaizzy
    lucasnewman

jobs:
  remind:
    name: Remind contributor
    runs-on: ubuntu-latest
    steps:
      - name: Post contribution checklist
        uses: actions/github-script@v7
        with:
          script: |
            const excludedUsers = new Set(
              process.env.PR_REMINDER_EXCLUDED_USERS
                .split("\n")
                .map((username) => username.trim().toLowerCase())
                .filter(Boolean)
            );
            const author = context.payload.pull_request.user.login;

            if (excludedUsers.has(author.toLowerCase())) {
              core.info(`Skipping reminder for excluded user @${author}.`);
              return;
            }

            const marker = "<!-- mlx-vlm-pr-contributor-reminder -->";
            const body = `${marker}
            👋 Thanks for contributing to MLX-VLM!

            Before your pull request is reviewed, please make sure that:

            - **Every commit is signed.** GitHub should show a **Verified** badge next to each commit. See [GitHub's commit-signing guide](https://docs.github.com/en/authentication/managing-commit-signature-verification/signing-commits) if you need help setting this up.
            - **The formatting hooks pass.** From the repository root, run:

              \`\`\`shell
              python -m pip install pre-commit
              pre-commit run --all-files
              \`\`\`

              The project's pre-commit configuration runs **Black** along with the other required formatters. Commit and push any changes it makes.

            Thank you for helping us keep the project consistent and easy to review! 🚀`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user?.type === "Bot" && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
