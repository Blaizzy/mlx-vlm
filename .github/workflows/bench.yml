name: Apple-silicon CI request

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  dispatch:
    if: >
      github.event.issue.pull_request &&
      github.event.comment.body == '/ci run'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Verify maintainer command
        env:
          COMMENTER: ${{ github.event.comment.user.login }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          [[ "$REPOSITORY" == Blaizzy/mlx-vlm ]]
          permission="$(gh api "repos/$REPOSITORY/collaborators/$COMMENTER/permission" --jq .permission)"
          [[ "$permission" == admin || "$permission" == maintain || "$permission" == write || "$permission" == push ]]
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.MLX_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.MLX_CI_APP_PRIVATE_KEY }}
          owner: Marvis-Labs
          repositories: mlx-ci
          permission-contents: write
      - name: Dispatch private control-plane request
        env:
          COMMENT_ID: ${{ github.event.comment.id }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          [[ "$COMMENT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          jq -n \
            --arg repository "$REPOSITORY" \
            --argjson pull_request "$PR_NUMBER" \
            --argjson comment_id "$COMMENT_ID" \
            '{event_type:"ci-run-request",client_payload:{schema_version:1,repository:$repository,pull_request:$pull_request,comment_id:$comment_id}}' \
            > "$RUNNER_TEMP/dispatch.json"
          gh api repos/Marvis-Labs/mlx-ci/dispatches \
            --method POST \
            --input "$RUNNER_TEMP/dispatch.json"
