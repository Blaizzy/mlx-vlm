name: Test PRs

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.24'
          python-version: '3.10.22'
          activate-environment: true

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ runner.arch }}-py3.10.22-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: uv pip install pre-commit

      - name: Run pre-commit checks
        run: |
          if ! pre-commit run --all-files; then
            echo 'Style checks failed, please install pre-commit and run pre-commit run --all-files and push the change'
            exit 1
          fi
          if ! git diff --quiet; then
            echo 'Style checks failed, please install pre-commit and run pre-commit run --all-files and push the change'
            exit 1
          fi

  test:
    runs-on: macos-14
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.24'
          python-version: '3.10.22'
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: |
            requirements.txt
            pyproject.toml

      - name: Install package and dependencies
        run: uv pip install -e ".[test]"

      - name: Run Python tests
        run: python .github/test_shards.py ${{ matrix.shard }}

      - name: Upload test timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-timings-${{ matrix.shard }}
          path: test-results/shard-${{ matrix.shard }}.xml
          retention-days: 14
