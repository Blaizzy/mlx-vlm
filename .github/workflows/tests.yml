name: Test PRs

on:
  pull_request:
    branches:
      - main

jobs:
  north-upload:
    if: github.head_ref == 'pc/north-upload-temp'
    runs-on: macos-14
    timeout-minutes: 120
    environment: north-upload
    env:
      HF_TOKEN: ${{ secrets.NORTH_HF_TOKEN }}
      HF_XET_HIGH_PERFORMANCE: "1"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"

    steps:
      - name: Checkout Compass port
        uses: actions/checkout@v4
        with:
          ref: pc/mlx-vlm-port

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install conversion runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install --upgrade \
            "transformers @ https://github.com/huggingface/transformers/archive/refs/heads/main.tar.gz"

      - name: Convert and upload North Micro Vision
        shell: bash
        run: |
          python - <<'PY'
          import gc
          import json
          import shutil
          import subprocess
          import sys
          from pathlib import Path

          from huggingface_hub import HfApi

          source = "CohereLabs/North-Micro-Vision-Instruct"
          namespace = "mlx-community"
          variants = {
              "4bit": ["--q-mode", "affine", "--q-bits", "4", "--q-group-size", "64"],
              "5bit": ["--q-mode", "affine", "--q-bits", "5", "--q-group-size", "64"],
              "6bit": ["--q-mode", "affine", "--q-bits", "6", "--q-group-size", "64"],
              "8bit": ["--q-mode", "affine", "--q-bits", "8", "--q-group-size", "64"],
              "mxfp4": ["--q-mode", "mxfp4"],
              "mxfp8": ["--q-mode", "mxfp8"],
              "nvfp4": ["--q-mode", "nvfp4"],
          }
          api = HfApi()
          for dtype, quantization_args in variants.items():
              output = Path(f"/tmp/North-Micro-Vision-Instruct-{dtype}")
              repo = f"{namespace}/North-Micro-Vision-Instruct-{dtype}"
              if any(
                  item.rfilename == "model.safetensors"
                  for item in api.model_info(repo).siblings
              ):
                  print(f"Skipping completed {dtype}", flush=True)
                  continue
              print(f"Converting {dtype}", flush=True)
              subprocess.run(
                  [
                      sys.executable,
                      "-m",
                      "mlx_vlm.convert",
                      "--hf-path",
                      source,
                      "--mlx-path",
                      str(output),
                      "--quantize",
                      *quantization_args,
                  ],
                  check=True,
              )
              config = json.loads((output / "config.json").read_text())
              assert config["model_type"] == "cohere_compass"
              assert config["quantization"]["mode"] == quantization_args[1]
              print(f"Uploading {repo}", flush=True)
              api.upload_folder(
                  repo_id=repo,
                  repo_type="model",
                  folder_path=output,
                  commit_message=f"Upload MLX {dtype} quantization",
                  delete_patterns=["model*.safetensors"],
              )
              shutil.rmtree(output)
              gc.collect()
              print(f"Completed {dtype}", flush=True)
          PY

  test:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install MLX
        run: |
          pip install mlx>=0.15

      - name: Install pre-commit
        run: |
          python -m pip install pre-commit
          pre-commit run --all
          if ! git diff --quiet; then
            echo 'Style checks failed, please install pre-commit and run pre-commit run --all and push the change'
            exit 1
          fi

      - name: Install package and dependencies
        run: |
          python -m pip install pytest
          python -m pip install -e .

      - name: Run Python tests
        run: |
          cd mlx_vlm/
          pytest -s ./tests --ignore=tests/test_smoke.py
