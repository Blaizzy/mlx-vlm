name: Test PRs

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.24'
          python-version: '3.10.22'
          activate-environment: true

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ runner.arch }}-py3.10.22-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: uv pip install pre-commit

      - name: Run pre-commit checks
        run: |
          if ! pre-commit run --all-files; then
            echo 'Style checks failed, please install pre-commit and run pre-commit run --all-files and push the change'
            exit 1
          fi
          if ! git diff --quiet; then
            echo 'Style checks failed, please install pre-commit and run pre-commit run --all-files and push the change'
            exit 1
          fi

  test:
    name: ${{ matrix.suite }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: interfaces
            suite: Server, CLI, sampling, tool streaming & generation
            os: ubuntu-24.04
            extras: 'test,cpu'
          - group: training-ops
            suite: Training, speculation & model operations
            os: macos-14
            extras: test
          - group: models
            suite: Models, cache, processors & offloading
            os: macos-14
            extras: test
          - group: media
            suite: Diffusion, audio, images, video & extraction
            os: macos-14
            extras: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.24'
          python-version: '3.10.22'
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: |
            requirements.txt
            pyproject.toml

      - name: Install package and dependencies
        run: uv pip install -e ".[${{ matrix.extras }}]"

      - name: Locate Metal compiler cache
        if: runner.os == 'macOS'
        id: metal
        run: |
          echo "path=$(getconf DARWIN_USER_CACHE_DIR)" >> "$GITHUB_OUTPUT"
          echo "version=$(sw_vers -buildVersion)-$(python -c 'import importlib.metadata; print(importlib.metadata.version("mlx"))')" >> "$GITHUB_OUTPUT"

      - name: Cache Metal compilation
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.metal.outputs.path }}/com.apple.metal
            ${{ steps.metal.outputs.path }}/com.apple.metalfe
          key: metal-${{ runner.arch }}-${{ steps.metal.outputs.version }}-${{ matrix.group }}-${{ hashFiles('mlx_vlm/**/*.py', 'mlx_vlm/**/*.json', '.github/test_shards.py') }}
          restore-keys: |
            metal-${{ runner.arch }}-${{ steps.metal.outputs.version }}-${{ matrix.group }}-
            metal-${{ runner.arch }}-${{ steps.metal.outputs.version }}-

      - name: Run Python tests
        run: python .github/test_shards.py ${{ matrix.group }}

      - name: Upload test timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-timings-${{ matrix.group }}
          path: test-results/${{ matrix.group }}.xml
          retention-days: 14
