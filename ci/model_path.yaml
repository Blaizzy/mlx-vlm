schema_version: 1
synthetic_profiles:
  dense_vlm:
    seed: 0
    dtype: float32
    weight_initializer:
      distribution: normal
      standard_deviation: 0.02
    text:
      hidden_size: 64
      intermediate_size: 128
      num_hidden_layers: 2
      num_attention_heads: 4
      num_key_value_heads: 2
      head_dim: 16
      vocab_size: 256
      max_position_embeddings: 512
    vision:
      hidden_size: 32
      intermediate_size: 64
      num_hidden_layers: 2
      num_attention_heads: 4
      patch_size: 14
      image_size: 28
      num_channels: 3
    projector:
      input_size: 32
      output_size: 64
      num_query_tokens: 4
    inputs:
      batch_size: 1
      sequence_length: 8
      image_count: 1
      image_height: 28
      image_width: 28
      image_channels: 3
      max_new_tokens: 1
    checks:
      - instantiate
      - language_forward
      - vision_forward
      - multimodal_forward
      - finite_logits
  moe_vlm:
    base: dense_vlm
    mixture_of_experts:
      num_experts: 4
      num_experts_per_token: 2
      expert_intermediate_size: 64
  cross_attention_vlm:
    base: dense_vlm
    cross_attention:
      num_layers: 1
      interval: 1
  anyres_vlm:
    base: dense_vlm
    inputs:
      image_grid_pinpoints:
        - [28, 28]
        - [28, 56]
  audio_vision_language:
    base: dense_vlm
    inputs:
      audio_frames: 16
      audio_features: 80
    checks:
      - instantiate
      - language_forward
      - vision_forward
      - audio_forward
      - multimodal_forward
      - finite_logits
  ocr_vlm:
    base: dense_vlm
    inputs:
      task: ocr
      prompt: Read the text in this image.
      image_height: 56
      image_width: 56
  embedding_encoder:
    seed: 0
    dtype: float32
    weight_initializer:
      distribution: normal
      standard_deviation: 0.02
    text:
      hidden_size: 32
      intermediate_size: 64
      num_hidden_layers: 2
      num_attention_heads: 4
      vocab_size: 256
      max_position_embeddings: 64
    inputs:
      batch_size: 3
      sequence_length: 8
    checks:
      - instantiate
      - embedding_forward
      - finite_embeddings
      - normalized_embeddings
