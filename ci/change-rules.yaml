schema_version: 1
rules:
  docs_change:
    component: docs_change
    include:
      - "*.md"
      - "**/*.md"
      - mkdocs.yml
      - docs/**
    exclude: []
  new_model_path:
    component: new_model_path
    include:
      - mlx_vlm/models/{model}/**
    exclude:
      - mlx_vlm/models/{model}/*.md
      - mlx_vlm/models/{model}/**/*.md
    base_path_absent: mlx_vlm/models/{model}
    head_path_present: mlx_vlm/models/{model}
    supersedes:
      - model_path
  model_path:
    component: model_path
    include:
      - mlx_vlm/models/{model}/**
    exclude:
      - mlx_vlm/models/{model}/*.md
      - mlx_vlm/models/{model}/**/*.md
